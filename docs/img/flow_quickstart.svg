<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" role="img" aria-label="Sweep All-in-One: axes in, every combination out"><title>Sweep All-in-One: axes in, every combination out</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/></marker></defs><rect width="980" height="330" rx="14" fill="#15171c"/><text x="24" y="34" text-anchor="start" font-size="18" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Quick start: Sweep All-in-One</text><rect x="30" y="80" width="200" height="62" rx="10" fill="#2f3470" stroke="#6f78d8" stroke-width="1.6"/><text x="130.0" y="106.25" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep Axis</text><text x="130.0" y="126.25" text-anchor="middle" font-size="13" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">seed: 1, 2, 3</text><rect x="30" y="190" width="200" height="62" rx="10" fill="#2f3470" stroke="#6f78d8" stroke-width="1.6"/><text x="130.0" y="216.25" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep Axis</text><text x="130.0" y="236.25" text-anchor="middle" font-size="13" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">cfg: 4, 7, 10</text><rect x="330" y="120" width="250" height="100" rx="10" fill="#2c5a35" stroke="#58b36b" stroke-width="1.6"/><text x="455.0" y="155.25" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep All-in-One</text><text x="455.0" y="175.25" text-anchor="middle" font-size="13" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">samples every combination</text><text x="455.0" y=