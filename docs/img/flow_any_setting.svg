113 L 900 200" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="905" y="100" text-anchor="middle" font-size="12" font-weight="400" fill="#98a2b3" font-family="Segoe UI, Helvetica, Arial, sans-serif">which values made each image</text><rect x="630" y="350" width="190" height="54" rx="10" fill="#1d2a3a" stroke="#4f8fcf" stroke-width="1.6"/><text x="725.0" y="372.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">named images</text><text x="725.0" y="391.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">seed1_cfg4_….png</text><rect x="840" y="350" width="170" height="54" rx="10" fill="#1d2a3a" stroke="#4f8fcf" stroke-width="1.6"/><text x="925.0" y="372.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">labelled grids</text><text x="925.0" y="391.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">one per prompt</text><rect x="420" y="350" width="190" height="54" rx="10" fill="#1d2a3a" stroke="#4f8fcf" stroke-width="1.6"/><text x="515.0" y="372.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">run list (CSV)</text><text x="515.0" y="391.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">values for every image</text><path d="M 900 280 L 900 312 L 725 312 L 725 350" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 900 280 L 900 312 L 925 312 L 925 350" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 900 280 L 900 312 L 515 312 L 515 350" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="520" y="445" text-anchor="middle" font-size="13" font-weight="400" fill="#98a2b3" font-family="Segoe UI, Helvetica, Arial, sans-serif">ComfyUI runs the connected nodes once per combination, one image at a time; the grid fills in as they finish.</text></svg>
