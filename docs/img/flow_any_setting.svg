<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="470" viewBox="0 0 1040 470" role="img" aria-label="Sweep any setting of your own workflow"><title>Sweep any setting of your own workflow</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8a93a6"/></marker></defs><rect width="1040" height="470" rx="14" fill="#15171c"/><text x="24" y="34" text-anchor="start" font-size="18" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep any setting of your own workflow</text><text x="24" y="56" text-anchor="start" font-size="13" font-weight="400" fill="#98a2b3" font-family="Segoe UI, Helvetica, Arial, sans-serif">Right-click a setting, choose “Sweep…”, and the axis is added and wired for you.</text><rect x="30" y="84" width="150" height="58" rx="10" fill="#2f3470" stroke="#6f78d8" stroke-width="1.6"/><text x="105.0" y="108.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep Axis: seed</text><text x="105.0" y="127.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">1–2</text><rect x="220" y="84" width="150" height="58" rx="10" fill="#2f3470" stroke="#6f78d8" stroke-width="1.6"/><text x="295.0" y="108.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep Axis: cfg</text><text x="295.0" y="127.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">4, 7, 10</text><rect x="410" y="84" width="150" height="58" rx="10" fill="#2f3470" stroke="#6f78d8" stroke-width="1.6"/><text x="485.0" y="108.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep Axis: prompt</text><text x="485.0" y="127.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">2 versions</text><rect x="610" y="78" width="170" height="70" rx="10" fill="#2f3470" stroke="#6f78d8" stroke-width="1.6"/><text x="695.0" y="108.25" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Sweep Plan</text><text x="695.0" y="128.25" text-anchor="middle" font-size="13" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">12 images: 2 × 3 × 2</text><path d="M 180 113 L 220 113" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 370 113 L 410 113" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M 560 113 L 610 113" fill="none" stroke="#8a93a6" stroke-width="1.8" marker-end="url(#arrow)"/><text x="30" y="190" text-anchor="start" font-size="13" font-weight="400" fill="#98a2b3" font-family="Segoe UI, Helvetica, Arial, sans-serif">your own workflow (any nodes)</text><rect x="30" y="210" width="140" height="60" rx="10" fill="#2b2f38" stroke="#6b7488" stroke-width="1.6"/><text x="100.0" y="244.9" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">Load Checkpoint</text><rect x="215" y="210" width="160" height="60" rx="10" fill="#2b2f38" stroke="#6b7488" stroke-width="1.6"/><text x="295.0" y="235.4" text-anchor="middle" font-size="14" font-weight="600" fill="#e8eaf0" font-family="Segoe UI, Helvetica, Arial, sans-serif">CLIP Text Encode</text><text x="295.0" y="254.4" text-anchor="middle" font-size="12" font-weight="400" fill="#c9d0dc" font-family="Segoe UI, Helvetica, Arial, sans-serif">prompt</text><rect x="420" y="210" width="150" height="60" rx="10" fill="#2b2f38" stroke="#6b7488" stroke-width="1.6"/><text x="495.0" y="235.4" text-anchor="middle" font-size="14" font-