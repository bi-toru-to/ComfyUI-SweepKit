[project]
name = "comfyui-sweepkit"
version = "1.1.0"
description = "Parameter sweeps for ComfyUI: sweep any setting of your own workflow or use the all-in-one generator; pair axes, try subsets, skip repeats; named images, labelled grids and a run list."
readme = "README.md"
requires-python = ">=3.10"
# No pip dependencies: torch, numpy and Pillow are provided by ComfyUI.
# The modular pipeline additionally needs the godmt/ComfyUI-List-Utils node pack.
dependencies = []
license = "MIT"
license-files = ["LICENSE"]

[project.urls]
Repository = "https://github.com/bi-toru-to/ComfyUI-SweepKit"
Issues = "https://github.com/bi-toru-to/ComfyUI-SweepKit/issues"

[tool.comfy]
PublisherId = ""  # fill in your Comfy Registry publisher ID before publishing
DisplayName = "SweepKit"
Icon = ""

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "C90", "PLR2004"]
ignore = ["E501"]  # long tooltip strings are intentional; line length is handled by the formatter

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "B", "C90"]
