name: publish to Comfy Registry

# Publishes a new version to the Comfy Registry (and so to ComfyUI Manager)
# whenever pyproject.toml changes on main, or when started by hand.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'bi-toru-to/ComfyUI-SweepKit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish to the Comfy Registry
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
