name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install test dependencies
        # torch and ComfyUI are not needed: tests/stubs replaces them.
        run: pip install numpy pillow ruff==0.17.3
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests
        run: python tests/run_all.py
